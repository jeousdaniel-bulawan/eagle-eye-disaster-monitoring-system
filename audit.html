<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs | Eagle Eye</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #0a0a0a; 
            --orange: #F97316; 
            --red: #DC2626;
            --green: #10B981;
            --gray: #6B7280;
            --text-main: #ffffff; 
            --text-dim: rgba(255, 255, 255, 0.4); 
            --grad: linear-gradient(90deg, #F97316 0%, #DC2626 100%);
            --v-grad: linear-gradient(180deg, #F97316 0%, #DC2626 100%);
            --border: rgba(255, 255, 255, 0.08);
            --card-bg: #121212;
        }

        body { 
            height: 100vh; 
            font-family: 'Inter', sans-serif; 
            background: var(--black); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #F97316 0%, #DC2626 100%); border-radius: 10px; }

        nav { 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 44px; height: 80px; border-bottom: 1px solid var(--border); 
            background: var(--black); z-index: 1000; flex-shrink: 0; 
        }
        .nav-logo { display: flex; align-items: center; gap: 14px; text-decoration: none; transition: opacity 0.2s; }
        .nav-logo:hover { opacity: 0.8; }
        
        .brand-logo { 
            height: 64px; 
            width: auto; 
            object-fit: contain; 
            filter: invert(1) contrast(200%); 
            mix-blend-mode: screen; 
        }

        .nav-right { display: flex; align-items: center; gap: 32px; height: 100%; }
        .nav-links { display: flex; gap: 32px; height: 100%; align-items: center; }
        .nav-links a { 
            position: relative; font-weight: 700; font-size: 0.85rem; color: var(--text-dim); 
            text-decoration: none; text-transform: uppercase; letter-spacing: 0.05em;
            height: 100%; display: flex; align-items: center; transition: all .2s ease;
        }
        .nav-links a:hover, .nav-links a.active { color: #fff; }
        .nav-links a.active::after { 
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; 
            height: 2px; background: var(--grad); box-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }

        .nav-user { position: relative; z-index: 9999; display: flex; align-items: center; }
        .dots-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 10px; border-radius: 10px; transition: all 0.2s; }
        .dots-btn:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        
        .dropdown-menu { 
            position: absolute; top: calc(100% + 10px); right: 0; width: 180px; 
            background: #121212; border: 1px solid var(--border); border-radius: 16px; 
            padding: 8px; display: none; flex-direction: column; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); backdrop-filter: blur(10px); 
        }
        .dropdown-menu.show { display: flex; animation: dropIn 0.2s ease-out; }
        @keyframes dropIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .dropdown-menu a { padding: 12px 16px; text-decoration: none; color: var(--text-dim); font-size: 0.85rem; font-weight: 600; border-radius: 8px; transition: all 0.2s; }
        .dropdown-menu a:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .dropdown-divider { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }
        .logout-link { color: var(--red) !important; }

        .dashboard-layout { flex: 1; display: flex; flex-direction: column; padding: 12px; overflow-y: auto; }
        
        .table-section { flex: 1; display: flex; flex-direction: column; min-height: 400px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        .table-top { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 16px; }
        .search-wrapper { position: relative; width: 100%; max-width: 400px; }
        .search-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
        .search-bar { 
            width: 100%; background: #0a0a0a; border: 1px solid var(--border); 
            border-radius: 8px; padding: 12px 16px 12px 40px; color: #fff; outline: none; font-size: 0.9rem;
        }

        .table-container { flex: 1; overflow: auto; width: 100%; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        thead th { 
            position: sticky; top: 0; z-index: 10; background: #151515; padding: 16px; 
            text-align: left; color: var(--text-dim); font-weight: 800; 
            border-bottom: 1px solid var(--border); cursor: pointer; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        thead th:hover { background: #1a1a1a; color: #fff; }
        thead th i { margin-left: 8px; font-size: 0.75rem; color: var(--orange); opacity: 0.4; }
        thead th.active-sort { color: #fff; }
        thead th.active-sort i { opacity: 1; }

        tbody td { padding: 16px; border-bottom: 1px solid var(--border); color: #ccc; vertical-align: middle; }
        tbody tr:hover { background: rgba(255, 255, 255, 0.02); }
        
        .timestamp-cell { color: var(--text-dim); font-weight: 500; white-space: nowrap; }
        .user-cell { font-family: monospace; font-weight: 700; color: var(--orange); letter-spacing: 0.5px; white-space: nowrap; }
        
        .desc-cell { color: #888; font-size: 0.8rem; line-height: 1.4; max-width: 500px; white-space: normal !important; }
        .highlight { color: var(--orange); font-weight: 700; }

        .badge { padding: 6px 10px; border-radius: 6px; font-size: 0.65rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; display: inline-block;}
        .action-create { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); } 
        .action-update { background: rgba(249, 115, 22, 0.15); color: var(--orange); border: 1px solid rgba(249, 115, 22, 0.3); } 
        .action-security { background: rgba(220, 38, 38, 0.15); color: var(--red); border: 1px solid rgba(220, 38, 38, 0.3); } 
        .action-select { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); } 
        .action-default { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); }

        .pagination-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; border-top: 1px solid var(--border);
            background: var(--card-bg); flex-shrink: 0; gap: 12px;
        }
        .pagination-info { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); white-space: nowrap; }
        .pagination-controls { display: flex; align-items: center; gap: 4px; }
        .page-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text-dim);
            width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
            font-size: 0.8rem; font-weight: 700; font-family: 'Inter', sans-serif;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .page-btn:hover:not(:disabled) { background: rgba(255,255,255,0.06); color: #fff; border-color: rgba(255,255,255,0.2); }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-btn.active { background: var(--grad); color: #fff; border-color: transparent; }
        .page-ellipsis { color: var(--text-dim); font-size: 0.8rem; padding: 0 4px; }

        @media (max-width: 1024px) {
            .dashboard-layout { padding: 24px; }
        }

        @media (max-width: 768px) {
            .dashboard-layout { padding: 16px; }
            .table-top { flex-direction: column; align-items: stretch; }
            .search-wrapper { max-width: 100%; }
            .search-bar { height: 44px; }
            table { min-width: 800px; }
        }
    
        .hamburger-btn {
            display: none;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            padding: 8px 10px;
            border-radius: 8px;
            transition: all 0.2s;
            flex-direction: column;
            gap: 4px;
            align-items: center;
            justify-content: center;
        }
        .hamburger-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .hamburger-btn .bar {
            width: 18px; height: 2px;
            background: currentColor;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .hamburger-btn.open .bar:nth-child(1) { transform: translateY(6px) rotate(45deg); }
        .hamburger-btn.open .bar:nth-child(2) { opacity: 0; }
        .hamburger-btn.open .bar:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
        .mobile-nav-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 998;
        }
        .mobile-nav-overlay.show { display: block; }
        .mobile-nav-panel {
            position: fixed;
            top: 0; right: -280px;
            width: 260px; height: 100vh;
            background: #0d0d0d;
            border-left: 1px solid var(--border);
            z-index: 999;
            display: flex;
            flex-direction: column;
            padding: 72px 24px 32px;
            gap: 4px;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }
        .mobile-nav-panel.show { right: 0; }
        .mobile-nav-panel a {
            display: block;
            padding: 14px 16px;
            text-decoration: none;
            color: var(--text-dim);
            font-weight: 700;
            font-size: 0.85rem;
            border-radius: 10px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .mobile-nav-panel a:hover, .mobile-nav-panel a.active-mobile {
            background: rgba(255,255,255,0.05);
            color: #fff;
        }
        .mobile-nav-panel .mobile-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
        .mobile-nav-panel .mobile-logout { color: var(--red) !important; }
        @media (max-width: 768px) {
            .hamburger-btn { display: inline-flex !important; }
            .nav-links { display: none !important; }
            .dots-btn { display: none !important; }
            .nav-user .dropdown-menu { display: none !important; }
            .nav-user { position: relative; }
        }
    </style>
</head>
<body>

<nav>
    <a href="admin.html" class="nav-logo">
        <img src="logo.png" alt="Console" class="brand-logo">
    </a>
    <div class="nav-right">
        <div class="nav-links">
            <a href="admin.html">Admin Dashboard</a>
            <a href="reports.html">Reports</a>
            <a href="audit.html" class="active">Audit Logs</a>
        </div>
        <div class="nav-user">
            <button class="hamburger-btn" id="hamburgerBtn" onclick="openMobileNav()" aria-label="Open navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <button class="dots-btn" id="menuBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="12" cy="5" r="1"></circle>
                    <circle cx="12" cy="19" r="1"></circle>
                </svg>
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="profile.html">Account Profile</a>
                <hr class="dropdown-divider">
                <a href="index.html" class="logout-link" onclick="localStorage.clear()">Log Out</a>
            </div>
        </div>
    </div>

<div class="mobile-nav-overlay" id="mobileNavOverlay" onclick="closeMobileNav()"></div>
<div class="mobile-nav-panel" id="mobileNavPanel">
    <a href="admin.html">Admin Dashboard</a>
    <a href="reports.html">Reports</a>
    <a href="audit.html" class="active-mobile">Audit Logs</a>
    <hr class="mobile-divider">
    <a href="profile.html">Account Profile</a>
    <hr class="mobile-divider">
    <a href="index.html" class="mobile-logout" onclick="localStorage.clear()">Log Out</a>
</div>
</nav>

<main class="dashboard-layout">
    <div class="table-section">
        <div class="table-top">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-bar" placeholder="Filter by user, action, or description...">
            </div>
        </div>
        <div class="table-container">
            <table id="auditTable">
                <thead>
                    <tr id="headerRow">
                        <th data-col="0" onclick="sortTable(0, this)">Timestamp <i class="fa-solid fa-sort"></i></th>
                        <th data-col="1" onclick="sortTable(1, this)">Action <i class="fa-solid fa-sort"></i></th>
                        <th data-col="2" onclick="sortTable(2, this)">Subject ID <i class="fa-solid fa-sort"></i></th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="auditData"></tbody>
            </table>
        </div>
        <div class="pagination-bar" id="paginationBar" style="display:none;">
            <span class="pagination-info" id="paginationInfo"></span>
            <div class="pagination-controls" id="paginationControls"></div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-init.js"></script>
    <script src="route-guard.js"></script>

<script>
    requireLogin(['admin']);

    let auditLogsData = [];
    let sortState     = { index: null, dir: 'desc' };
    const PAGE_SIZE   = 10;
    let allRows       = [];   // visible TR elements after render + filter
    let currentPage   = 1;

    const menuBtn     = document.getElementById('menuBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    if (menuBtn) {
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('show');
        });
    }
    document.addEventListener('click', () => {
        if (dropdownMenu) dropdownMenu.classList.remove('show');
    });

    function openMobileNav() {
        document.getElementById('mobileNavOverlay').classList.add('show');
        document.getElementById('mobileNavPanel').classList.add('show');
        document.getElementById('hamburgerBtn').classList.add('open');
    }
    function closeMobileNav() {
        document.getElementById('mobileNavOverlay').classList.remove('show');
        document.getElementById('mobileNavPanel').classList.remove('show');
        const btn = document.getElementById('hamburgerBtn');
        if (btn) btn.classList.remove('open');
    }

    function getBadgeClass(action) {
        const a = String(action || '').toUpperCase();
        if (a === 'INSERT') return 'action-create';
        if (a === 'UPDATE') return 'action-update';
        if (a === 'DELETE') return 'action-security';
        if (a === 'SELECT') return 'action-select';
        return 'action-default';
    }

    function formatSubjectId(id) {
        if (!id) return 'SYSTEM';
        return String(id).replace(/^USR/, 'US').replace(/^STF/, 'US');
    }

    function formatDescription(log) {
        const action  = String(log.action || '').toUpperCase();
        const oldData = log.old_data || {};
        const newData = log.new_data || {};

        if (action === 'INSERT') {
            const identifier = newData.username || newData.email || formatSubjectId(log.user_id) || 'new entry';
            const role = newData.role ? ` as <span class="highlight">${newData.role}</span>` : '';
            return `Registered new account for <span class="highlight">${identifier}</span>${role}.`;
        }
        if (action === 'DELETE') return `Record removed.`;
        if (action === 'SELECT') return `Record viewed/read (for security tracking).`;

        if (action === 'UPDATE') {
            const changeDescriptions = [];
            const keys = new Set([...Object.keys(oldData), ...Object.keys(newData)]);
            let hasProfilePicUpdate = false;

            keys.forEach(key => {
                if (['id','updated_at','created_at','changed_at','last_sign_in_at'].includes(key)) return;
                const oldVal = oldData[key];
                const newVal = newData[key];
                if (JSON.stringify(oldVal) !== JSON.stringify(newVal)) {
                    if (key === 'profile_pic') {
                        hasProfilePicUpdate = true;
                    } else {
                        const fieldName   = key.replace(/_/g, ' ');
                        const oldDisplay  = (oldVal === null || oldVal === undefined || oldVal === '') ? 'none' : oldVal;
                        const newDisplay  = (newVal === null || newVal === undefined || newVal === '') ? 'none' : newVal;
                        changeDescriptions.push(`modified <span class="highlight">${fieldName}</span> from <span class="highlight">${oldDisplay}</span> to <span class="highlight">${newDisplay}</span>`);
                    }
                }
            });

            if (hasProfilePicUpdate) changeDescriptions.push(`updated profile picture`);
            if (changeDescriptions.length > 0) {
                const summary = changeDescriptions.join(', ');
                return summary.charAt(0).toUpperCase() + summary.slice(1) + '.';
            }
            return `Synchronized record metadata.`;
        }
        return `System event recorded.`;
    }

    async function fetchAuditLogs() {
        if (!window.supabase) return;
        try {
            const { data, error } = await window.supabase
                .from('user_audit_log')
                .select('*')
                .order('changed_at', { ascending: false });

            if (error) throw error;
            auditLogsData = data || [];
            renderAuditLogs(auditLogsData);

            window.supabase
                .channel('audit-realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'user_audit_log' }, payload => {
                    auditLogsData.unshift(payload.new);
                    renderAuditLogs(auditLogsData);
                })
                .subscribe();

        } catch (err) {
            console.error('Audit Sync Error:', err.message);
        }
    }

    function renderAuditLogs(data) {
        const tbody = document.getElementById('auditData');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:100px;color:var(--text-dim);">No registry entries found.</td></tr>`;
            document.getElementById('paginationBar').style.display = 'none';
            return;
        }

        data.forEach(log => {
            const tr = document.createElement('tr');
            const displayDate = log.changed_at
                ? new Date(log.changed_at).toLocaleString('en-GB', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                  })
                : 'N/A';

            tr.innerHTML = `
                <td class="timestamp-cell">${displayDate}</td>
                <td><span class="badge ${getBadgeClass(log.action)}">${log.action || 'EVENT'}</span></td>
                <td class="user-cell">${formatSubjectId(log.user_id)}</td>
                <td class="desc-cell">${formatDescription(log)}</td>`;
            tbody.appendChild(tr);
        });

        syncAllRows();
        applySearchFilter();
    }

    function syncAllRows() {
        const tbody = document.getElementById('auditData');
        allRows = Array.from(tbody.querySelectorAll('tr')).filter(tr => !tr.querySelector('td[colspan]'));
    }

    function applySearchFilter() {
        const val = (document.getElementById('searchInput')?.value || '').toLowerCase();
        const tbody = document.getElementById('auditData');
        const all   = Array.from(tbody.querySelectorAll('tr')).filter(tr => !tr.querySelector('td[colspan]'));

        all.forEach(tr => tr.style.display = '');
        allRows = val ? all.filter(tr => tr.textContent.toLowerCase().includes(val)) : all;
        all.filter(tr => !allRows.includes(tr)).forEach(tr => tr.style.display = 'none');

        renderPage(1);
    }

    document.getElementById('searchInput')?.addEventListener('input', applySearchFilter);

    function sortTable(n, header) {
        const tbody = document.getElementById('auditData');
        if (!tbody) return;
        const rows = Array.from(tbody.querySelectorAll('tr')).filter(tr => !tr.querySelector('td[colspan]'));
        if (!rows.length) return;

        sortState.dir   = (sortState.index === n && sortState.dir === 'asc') ? 'desc' : 'asc';
        sortState.index = n;

        document.querySelectorAll('#headerRow th').forEach(th => {
            th.classList.remove('active-sort');
            const icon = th.querySelector('i');
            if (icon) icon.className = 'fa-solid fa-sort';
        });
        header.classList.add('active-sort');
        const activeIcon = header.querySelector('i');
        if (activeIcon) activeIcon.className = sortState.dir === 'asc' ? 'fa-solid fa-sort-up' : 'fa-solid fa-sort-down';

        rows.sort((a, b) => {
            const cellA = a.getElementsByTagName('TD')[n];
            const cellB = b.getElementsByTagName('TD')[n];
            let valA, valB;

            if (n === 0) {
                const parseDate = txt => {
                    const parts = txt.split(', ');
                    const [d, m, y] = parts[0].split('/');
                    return new Date(`${y}-${m}-${d}T${parts[1]}`).getTime();
                };
                valA = parseDate(cellA.innerText);
                valB = parseDate(cellB.innerText);
            } else {
                valA = cellA.innerText.toLowerCase();
                valB = cellB.innerText.toLowerCase();
            }

            if (valA < valB) return sortState.dir === 'asc' ? -1 : 1;
            if (valA > valB) return sortState.dir === 'asc' ?  1 : -1;
            return 0;
        });

        rows.forEach(r => tbody.appendChild(r));

        allRows = rows.filter(tr => tr.style.display !== 'none');
        renderPage(1);
    }

    function renderPage(page) {
        currentPage       = page;
        const total       = allRows.length;
        const totalPages  = Math.ceil(total / PAGE_SIZE) || 1;
        const start       = (page - 1) * PAGE_SIZE;
        const end         = Math.min(start + PAGE_SIZE, total);

        allRows.forEach((tr, i) => { tr.style.display = (i >= start && i < end) ? '' : 'none'; });

        document.getElementById('paginationInfo').textContent =
            total > 0 ? `Showing ${start + 1}–${end} of ${total} entries` : '';

        const ctrl = document.getElementById('paginationControls');
        ctrl.innerHTML = '';

        function addBtn(label, pg, isActive, disabled) {
            const btn = document.createElement('button');
            btn.className = 'page-btn' + (isActive ? ' active' : '');
            btn.innerHTML = label;
            btn.disabled  = disabled;
            if (!disabled) btn.onclick = () => renderPage(pg);
            ctrl.appendChild(btn);
        }

        addBtn('&#8249;', currentPage - 1, false, currentPage === 1);

        const pages = [];
        if (totalPages <= 7) {
            for (let i = 1; i <= totalPages; i++) pages.push(i);
        } else {
            pages.push(1);
            if (currentPage > 3) pages.push('…');
            for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) pages.push(i);
            if (currentPage < totalPages - 2) pages.push('…');
            pages.push(totalPages);
        }

        pages.forEach(p => {
            if (p === '…') {
                const s = document.createElement('span');
                s.className = 'page-ellipsis'; s.textContent = '…';
                ctrl.appendChild(s);
            } else {
                addBtn(p, p, p === currentPage, false);
            }
        });

        addBtn('&#8250;', currentPage + 1, false, currentPage >= totalPages);
        document.getElementById('paginationBar').style.display = total > 0 ? 'flex' : 'none';
    }

    // ── BOOT ───────────────────────────────────────────────────────────────────
    window.onload = fetchAuditLogs;
</script>
</body>
</html>
