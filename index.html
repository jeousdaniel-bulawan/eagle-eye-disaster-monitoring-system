<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Eye | Locate the Missing</title>
    
    <link rel="icon" type="image/svg+xml" href="favicon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        :root {
            --black: #0a0a0a;
            --orange: #F97316;
            --red: #DC2626;
            --grad: linear-gradient(90deg, #F97316 0%, #DC2626 100%);
        }

        html, body { 
            height: 100%; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            background-color: var(--black);
        }

        body {
            background: url('https://images.unsplash.com/photo-1473968512647-3e447244af8f?auto=format&fit=crop&q=80&w=1800') center/cover no-repeat;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom, 
                rgba(10,10,10,0.7) 0%, 
                rgba(10,10,10,0.3) 50%, 
                rgba(10,10,10,0.9) 100%
            );
            z-index: 1;
        }

        header {
            position: absolute;
            top: 0; 
            left: 0; 
            right: 0;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            padding: 32px 64px;
            z-index: 10;
        }

        .nav-logo { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            text-decoration: none; 
            background: transparent;
        }

        .brand-logo {
            display: block; 
            height: 100px;
            width: auto;
            object-fit: contain;
            filter: invert(1) contrast(200%); 
            mix-blend-mode: screen; 
            background: transparent;
        }

        .auth-group { 
            display: flex; 
            gap: 28px; 
            align-items: center; 
        }

        .btn-signin { 
            font-weight: 600; 
            font-size: 0.95rem; 
            color: #fff; 
            text-decoration: none; 
            opacity: 0.7; 
            transition: opacity 0.2s, color 0.2s; 
        }

        .btn-signin:hover { 
            opacity: 1; 
        }

        .btn-pill {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 12px 28px; 
            border-radius: 999px;             
            background: var(--grad); 
            color: #fff;
            font-weight: 700; 
            font-size: 0.9rem;
            border: none; 
            cursor: pointer; 
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-pill:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4);
        }

        .icon-arrow-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
        }

        .icon-arrow-wrapper svg {
            width: 16px;
            height: 16px;
        }

        .hero {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 24px;
        }

        .hero-content { 
            max-width: 900px;
            animation: heroReveal 1s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes heroReveal { 
            from { opacity: 0; transform: translateY(40px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .hero-eyebrow {
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 999px; 
            padding: 8px 20px;
            font-size: 0.75rem; 
            font-weight: 700; 
            letter-spacing: 0.15em;
            text-transform: uppercase; 
            color: #fff;
            margin-bottom: 32px;
        }

        .eyebrow-dot { 
            width: 7px; 
            height: 7px; 
            border-radius: 50%; 
            background: var(--orange); 
            box-shadow: 0 0 10px var(--orange);
        }

        .hero h1 {
            font-family: 'Inter', sans-serif;
            font-size: clamp(3rem, 8.5vw, 5.8rem);
            font-weight: 900; 
            color: #fff;
            line-height: 1.02; 
            letter-spacing: -0.04em;
            margin-bottom: 28px;
        }

        .hero h1 em {
            font-style: normal;
            background: var(--grad);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.2rem; 
            color: rgba(255,255,255,0.6);
            max-width: 580px; 
            margin: 0 auto 48px; 
            line-height: 1.6;
        }

        .btn-cta {
            padding: 20px 64px; 
            border-radius: 999px;             
            background: var(--grad); 
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-weight: 800; 
            font-size: 1.1rem;
            border: none; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block;
            box-shadow: 0 12px 35px rgba(220, 38, 38, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-cta:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 18px 45px rgba(220, 38, 38, 0.5); 
        }

        @media (max-width: 1024px) {
            header {
                padding: 24px 48px;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 20px 32px;
            }
            .auth-group {
                gap: 16px;
            }
            .btn-pill {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
            .hero-eyebrow {
                margin-bottom: 24px;
            }
            .hero h1 {
                font-size: clamp(2.5rem, 7vw, 3.5rem);
                margin-bottom: 20px;
            }
            .hero p {
                font-size: 1.1rem;
                max-width: 90%;
                margin-bottom: 36px;
            }
            .btn-cta {
                padding: 16px 48px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 16px 20px;
            }
            .btn-pill {
                padding: 8px 16px;
                font-size: 0.8rem;
            }
            .icon-arrow-wrapper {
                width: 20px;
                height: 20px;
            }
            .icon-arrow-wrapper svg {
                width: 12px;
                height: 12px;
            }
            .hero {
                padding: 0 16px;
            }
            .hero h1 {
                font-size: clamp(2.2rem, 8vw, 2.5rem);
            }
            .hero p {
                font-size: 1rem;
                margin-bottom: 32px;
            }
            .btn-cta {
                padding: 16px 32px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="nav-logo">
        <img src="logo.png" alt="Eagle Eye Logo" class="brand-logo">
    </a>

    <div class="auth-group">
        <a href="login.html" class="btn-pill"> Log In
            <span class="icon-arrow-wrapper">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 12H19" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 5L19 12L12 19" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
        </a>
    </div>
</header>

<main class="hero">
    <div class="hero-content">
        <div class="hero-eyebrow">
            <span class="eyebrow-dot"></span>
            Search &amp; Rescue
        </div>
        
        <h1>Spot the unseen.<br><em>Save the stranded.</em></h1>
        
        <p>
            Advanced drone surveillance, thermal mapping, and live GPS tracking 
            integrated into a single mission.
        </p>
        
        <a href="signup.html" class="btn-cta">Get Started</a>
    </div>
</main>

</body>
</html>
